version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_management_gui
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=student_db
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: "host"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: student_management_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_db
    ports:
      - "3306:3306"
    volumes:
      # Volume giúp lưu dữ liệu MySQL không bị mất khi restart/stop container
      - mysql_data:/var/lib/mysql
      # Tự động import file khởi tạo SQL trong thư mục database nếu có
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
